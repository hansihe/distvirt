[package]
name = "distvirt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
containerd-client = "0.8"
distvirt-guest-protocol = { path = "../distvirt-guest-protocol" }
distvirt-types = { path = "../distvirt-types" }
libc = "0.2"
log = "0.4"
oci-spec = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
smoltcp = { version = "0.12", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-udp", "alloc", "log"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "process"] }
tonic = "0.12"
