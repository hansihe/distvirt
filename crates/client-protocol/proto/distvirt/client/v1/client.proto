syntax = "proto3";
package distvirt.client.v1;

// --- Service Definition ---

service DistvirtClient {
    // Namespace lifecycle
    rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse);
    rpc UpdateNamespace(UpdateNamespaceRequest) returns (UpdateNamespaceResponse);
    rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
    rpc GetNamespaceStatus(GetNamespaceStatusRequest) returns (GetNamespaceStatusResponse);
    rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);

    // Splice / Unsplice
    rpc Splice(SpliceRequest) returns (SpliceResponse);
    rpc Unsplice(UnspliceRequest) returns (UnspliceResponse);

    // Workload lifecycle hints
    rpc DeactivateWorkload(DeactivateWorkloadRequest) returns (DeactivateWorkloadResponse);

    // Patch (partial update)
    rpc PatchNamespace(PatchNamespaceRequest) returns (PatchNamespaceResponse);

    // Cloning
    rpc CloneNamespace(CloneNamespaceRequest) returns (CloneNamespaceResponse);

    // Layer 2 resource queries
    rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
    rpc GetWorker(GetWorkerRequest) returns (GetWorkerResponse);
    rpc ListPods(ListPodsRequest) returns (ListPodsResponse);

    // Developer network access
    rpc ConnectNetwork(ConnectNetworkRequest) returns (ConnectNetworkResponse);
    rpc DisconnectNetwork(DisconnectNetworkRequest) returns (DisconnectNetworkResponse);

    // Workload I/O
    rpc AttachWorkload(stream AttachWorkloadInput) returns (stream AttachWorkloadOutput);

    // Streaming subscriptions
    rpc WatchNamespaceStatus(WatchNamespaceStatusRequest) returns (stream NamespaceStatusEvent);
    rpc StreamLogs(StreamLogsRequest) returns (stream LogChunk);
    rpc StreamEvents(StreamEventsRequest) returns (stream NamespaceEvent);
}

// --- Spec Types ---

enum RunPolicy {
    RUN_POLICY_SERVICE = 0;      // long-lived, restart on any exit (default)
    RUN_POLICY_JOB = 1;          // run-to-completion, exit 0 = done, non-zero = retry with backoff
}

message NamespaceSpec {
    NetworkConfig network = 1;
    map<string, WorkloadSpec> workloads = 2;
    map<string, ServiceSpec> services = 3;
}

message WorkloadSpec {
    PodNetworkConfig network = 1;
    repeated ContainerSpec containers = 2;
    bool suspend_on_idle = 3;
    ResourceRequirements resources = 4;
    ActivationSpec activation = 5;
    // If true, the workload respects demand signals and starts dormant.
    // If false (default), the workload is always-on.
    bool respects_demand = 6;
    repeated VolumeSpec volumes = 7;
    // Whether this workload runs as a long-lived service or a run-to-completion job.
    // Defaults to SERVICE if unset.
    RunPolicy run_policy = 8;
}

message ResourceValues {
    uint64 memory_mb = 1;
    uint32 vcpus = 2;
}

message ResourceRequirements {
    ResourceValues requests = 1;
    ResourceValues limits = 2;
}

message ContainerSpec {
    string name = 1;
    string image = 2;
    ContainerConfig config = 3;
}

message PodNetworkConfig {
    string ip = 1;
    string mac = 2;
}

message ServiceSpec {
    string workload_id = 1;
    ServiceNetworkConfig network = 2;
    ActivationSpec activation = 3;
    repeated ExposeSpec expose = 4;
}

message ActivationSpec {
    ActivatorConfig activator = 1;
    ServicePolicy buffer_policy = 2;
}

message ActivatorConfig {
    oneof activator {
        TcpActivator tcp = 1;
        Http2Activator http2 = 2;
        PassthroughActivator passthrough = 3;
    }
}

message PassthroughActivator {
    uint64 idle_timeout_ms = 1;
}

message TcpActivator {
    repeated uint32 ports = 1;
    uint64 idle_timeout_ms = 2;
}

message Http2Activator {}

message ContainerConfig {
    repeated string entrypoint = 1;
    repeated string args = 2;
    map<string, string> env = 3;
    reserved 4, 5;
    reserved "memory_mb", "vcpus";
    string working_dir = 6;
    string user = 7;
    string hostname = 8;
    bool tty = 9;              // allocate a PTY for the entrypoint at launch
    repeated VolumeMountSpec volume_mounts = 10;
}

// --- Volume Types ---

message VolumeSpec {
    string name = 1;
    oneof volume_type {
        EmptyDirVolume empty_dir = 2;
        ConfigDataVolume config_data = 3;
    }
}

message EmptyDirVolume {
    uint64 size_mb = 1;        // optional max size in MB; 0 means default
}

message ConfigDataVolume {
    repeated ConfigDataFile files = 1;
}

message ConfigDataFile {
    string path = 1;           // relative path within the volume
    string content = 2;        // file content (UTF-8)
}

message VolumeMountSpec {
    string name = 1;           // references VolumeSpec.name on the workload
    string mount_path = 2;     // absolute path inside the container
}

message ServiceNetworkConfig {
    string ip = 1;
    string mac = 2;
}

message NetworkConfig {
    string subnet = 1;
}

message ExposeSpec {
    uint32 container_port = 1;
    uint32 host_port = 2;
    ExposeProtocol protocol = 3;
}

enum ExposeProtocol {
    EXPOSE_PROTOCOL_UNSPECIFIED = 0;
    EXPOSE_PROTOCOL_TCP = 1;
    EXPOSE_PROTOCOL_UDP = 2;
}

message ServicePolicy {
    // Buffer policy configuration for activation.
}

// --- Namespace Lifecycle ---

message CreateNamespaceRequest {
    string namespace_id = 1;
    NamespaceSpec spec = 2;
}
message CreateNamespaceResponse {}

message UpdateNamespaceRequest {
    string namespace_id = 1;
    NamespaceSpec spec = 2;
}
message UpdateNamespaceResponse {}

message DeleteNamespaceRequest {
    string namespace_id = 1;
}
message DeleteNamespaceResponse {}

message GetNamespaceStatusRequest {
    string namespace_id = 1;
}
message GetNamespaceStatusResponse {
    NamespaceStatusReport status = 1;
}

message ListNamespacesRequest {}
message ListNamespacesResponse {
    repeated NamespaceStatusReport namespaces = 1;
}

// --- Status Reporting ---

message NamespaceStatusReport {
    string namespace_id = 1;
    NamespaceState state = 2;
    map<string, WorkloadStatusReport> workloads = 3;
    map<string, ServiceStatusReport> services = 4;
    map<string, PodStatusReportEntry> pods = 5;
}

message PodStatusReportEntry {
    string workload_id = 1;
    string worker_id = 2;
    string ip = 3;
    PodState state = 4;
}

enum NamespaceState {
    NAMESPACE_STATE_UNSPECIFIED = 0;
    NAMESPACE_STATE_CREATING = 1;
    NAMESPACE_STATE_ACTIVE = 2;
    NAMESPACE_STATE_DESTROYING = 3;
}

message WorkloadStatusReport {
    WorkloadState state = 1;
    bool spliced = 2;
    string ip = 3;
}

message WorkloadState {
    oneof state {
        WorkloadDormant dormant = 1;
        WorkloadWaitingForSpec waiting_for_spec = 2;
        WorkloadLaunching launching = 3;
        WorkloadRunning running = 4;
        WorkloadSuspending suspending = 5;
        WorkloadSuspended suspended = 6;
        WorkloadRetryBackoff retry_backoff = 7;
        WorkloadFailed failed = 8;
        WorkloadCompleted completed = 9;
    }
}

message WorkloadDormant {}
message WorkloadWaitingForSpec {}

message WorkloadLaunching {
    string pod_id = 1;
    string worker_id = 2;
}

message WorkloadRunning {
    string pod_id = 1;
    string worker_id = 2;
}

message WorkloadSuspending {
    string pod_id = 1;
    string worker_id = 2;
}

message WorkloadSuspended {}
message WorkloadRetryBackoff {}
message WorkloadFailed {
    optional int32 exit_code = 1;
    string reason = 2;
}
message WorkloadCompleted {
    int32 exit_code = 1;
}

message ServiceStatusReport {
    string workload_id = 1;
    ServiceState state = 2;
    bool activation_enabled = 3;
    bool spliced = 4;
    string ip = 5;
    string mac = 6;
}

message ServiceState {
    oneof state {
        ServicePending pending = 1;
        ServiceIdle idle = 2;
        ServiceNeedBackend need_backend = 3;
        ServiceActive active = 4;
    }
}

message ServicePending {}
message ServiceIdle {}
message ServiceNeedBackend {}

message ServiceActive {
    string pod_id = 1;
    string worker_id = 2;
    BackendNeed backend_need = 3;
}

enum BackendNeed {
    BACKEND_NEED_UNSPECIFIED = 0;
    BACKEND_NEED_NONE = 1;
    BACKEND_NEED_TRAFFIC = 2;
    BACKEND_NEED_ACTIVE = 3;
}

// --- Splice ---

message SpliceRequest {
    string namespace_id = 1;
    string workload_id = 2;
    string local_worker_id = 3;
}
message SpliceResponse {}

message UnspliceRequest {
    string namespace_id = 1;
    string workload_id = 2;
}
message UnspliceResponse {}

// --- Patch Namespace ---

message PatchNamespaceRequest {
    string namespace_id = 1;
    // Upsert: create if absent, replace if present
    map<string, WorkloadSpec> workloads = 2;
    map<string, ServiceSpec> services = 3;
    // Remove by name (ignored if absent)
    repeated string remove_workloads = 4;
    repeated string remove_services = 5;
}
message PatchNamespaceResponse {}

// --- Deactivate Workload ---

message DeactivateWorkloadRequest {
    string namespace_id = 1;
    string workload_id = 2;
}

message DeactivateWorkloadResponse {
    bool deactivated = 1;       // true if workload was deactivated
    string reason = 2;          // human-readable explanation when not deactivated
}

// --- Connect / Disconnect (Developer Network Access) ---

message ConnectNetworkRequest {
    string namespace_id = 1;
    bytes client_public_key = 2;   // 32-byte X25519 public key from CLI
}

message ConnectNetworkResponse {
    bytes server_public_key = 1;   // 32-byte X25519 public key of worker's WG adapter
    string endpoint = 2;           // "host:port" (worker public IP + WG listen port)
    string client_ip = 3;          // IP assigned to client on namespace subnet
    string subnet = 4;             // Namespace subnet CIDR (becomes AllowedIPs)
}

message DisconnectNetworkRequest {
    string namespace_id = 1;
    bytes client_public_key = 2;
}
message DisconnectNetworkResponse {}

// --- Cloning ---

message CloneNamespaceRequest {
    string source_namespace_id = 1;
    string target_namespace_id = 2;
    NamespaceOverrides overrides = 3;
}
message CloneNamespaceResponse {}

message NamespaceOverrides {
    map<string, WorkloadOverrides> workloads = 1;
    map<string, ServiceOverrides> services = 2;
}

message WorkloadOverrides {
    optional string image = 1;
    map<string, string> env_overrides = 2;
}

message ServiceOverrides {
    optional string workload_id = 1;
}

// --- Layer 2: Resource Queries ---

message ListWorkersRequest {}
message ListWorkersResponse {
    repeated WorkerInfo workers = 1;
}

message GetWorkerRequest {
    string worker_id = 1;
}
message GetWorkerResponse {
    WorkerInfo worker = 1;
}

message WorkerInfo {
    string worker_id = 1;
    uint32 max_pods = 2;
    uint64 available_memory_mb = 3;
    uint32 active_pods = 4;
}

message ListPodsRequest {
    string namespace_id = 1;
}
message ListPodsResponse {
    repeated PodInfo pods = 1;
}

message PodInfo {
    string pod_id = 1;
    string workload_id = 2;
    string worker_id = 3;
    string ip = 4;
    string mac = 5;
    PodState state = 6;
}

enum PodState {
    POD_STATE_UNSPECIFIED = 0;
    POD_STATE_LAUNCHING = 1;
    POD_STATE_RUNNING = 2;
    POD_STATE_SUSPENDING = 3;
    POD_STATE_SUSPENDED = 4;
    POD_STATE_RESUMING = 5;
    POD_STATE_FINISHED = 6;
    POD_STATE_FAILED = 7;
    POD_STATE_DISPLACED = 8;
}

// --- Events ---
//
// Event Lifecycle Contract
//
// == Delivery guarantees ==
//
// Events are generated from state machine signal changes at the end of each
// reconciliation cycle. The following guarantees hold:
//
// 1. EVENTUAL CONSISTENCY: Every state that persists across a reconciliation
//    boundary will produce an event. The event stream, combined with an
//    initial GetNamespaceStatus snapshot, is sufficient to maintain a
//    consistent local model.
//
// 2. STATES MAY BE SKIPPED: Intermediate states that exist for less than one
//    reconciliation cycle may not produce events. For example, a workload may
//    transition directly from Dormant to Running without a Launching event,
//    or a pod may go from Launching to Failed without a Running event.
//    Clients MUST handle any valid state appearing after any other state.
//
// 3. MONOTONIC TIMESTAMPS: Events within a single entity type are ordered.
//    Events across entity types (pod vs workload vs endpoint) from the same
//    reconciliation cycle have no ordering guarantee.
//
// 4. NO DUPLICATES: A state change event is emitted at most once per
//    actual transition.
//
// == Pod state transitions ==
//
// Valid terminal states: Finished, Failed, Displaced
// Non-terminal states: Launching, Running, Suspending, Suspended, Resuming
//
// Any non-terminal state may transition to any terminal state.
// Normal forward flow: Launching -> Running -> [Suspending -> Suspended | Finished]
// Resume flow: Resuming -> Running
// Any non-terminal -> Failed (timeout, worker lost, owner lost)
// Any non-terminal -> Displaced (lease revoked)
// Launching -> Failed (launch timeout)
//
// Pod lifecycle: PodCreated -> state changes -> PodReaped
//
// == Workload state transitions ==
//
// Valid terminal states: Failed, Completed
// Non-terminal states: Dormant, WaitingForSpec, Launching, Running,
//                      Suspending, Suspended, RetryBackoff
//
// Any non-terminal state may transition to any other non-terminal state
// or to a terminal state. The workload state is DERIVED from internal
// control fields, not an explicit state machine, so arbitrary transitions
// are possible. Clients MUST NOT assume a fixed transition order.
//
// Common flows:
//   Dormant -> [WaitingForSpec ->] Launching -> Running -> Dormant (service)
//   Dormant -> Launching -> Running -> Completed (job)
//   Running -> Suspending -> Suspended -> Launching -> Running (suspend cycle)
//   Running -> RetryBackoff -> Launching -> Running (retry cycle)
//   Running -> RetryBackoff -> Failed (max retries)
//
// == Client state tracking ==
//
// To maintain a local state model:
// 1. Call GetNamespaceStatus to get initial snapshot
// 2. Subscribe to StreamEvents (with historical buffer overlap)
// 3. Apply each WorkloadStateChanged event by replacing the workload's
//    current state with the event's new_state
// 4. Apply each Pod event by updating the pod's state accordingly
// 5. For wait_for() predicates, check after each state update

message StreamEventsRequest {
    string namespace_id = 1;
    repeated string workload_ids = 2;
    repeated string service_ids = 3;
}

message NamespaceEvent {
    int64 timestamp_unix_ms = 1;
    oneof event {
        WorkloadEvent workload = 2;
        PodEvent pod = 3;
        EndpointEvent endpoint = 4;
    }
}

message WorkloadEvent {
    string workload_id = 1;
    oneof event {
        WorkloadDemandChanged demand_changed = 2;
        WorkloadSpliced spliced = 3;
        WorkloadUnspliced unspliced = 4;
        WorkloadStateChanged state_changed = 5;
    }
}

message WorkloadDemandChanged {
    uint32 demanding_services = 1;
}

message WorkloadSpliced {
    string worker_id = 1;
}

message WorkloadUnspliced {}

message WorkloadStateChanged {
    WorkloadState old_state = 1;
    WorkloadState new_state = 2;
}

message PodEvent {
    string pod_id = 1;
    string workload_id = 2;
    oneof event {
        PodCreated created = 3;
        PodScheduled scheduled = 4;
        PodRunning running = 5;
        PodStopped stopped = 6;
        PodFailed failed = 7;
        PodSuspending suspending = 8;
        PodSuspended suspended = 9;
        PodSuspendFailed suspend_failed = 10;
        PodResuming resuming = 11;
        PodDisplaced displaced = 12;
        PodReaped reaped = 13;
    }
}

message PodCreated {}

message PodScheduled {
    string worker_id = 1;
}

message PodRunning {
    string worker_id = 1;
}

message PodStopped {
    int32 exit_code = 1;
}

message PodFailed {
    string reason = 1;
}

message PodSuspending {
    string worker_id = 1;
}

message PodSuspended {
    string worker_id = 1;
    string snapshot_id = 2;
}

message PodSuspendFailed {
    string reason = 1;
}

message PodResuming {
    string worker_id = 1;
}

message PodDisplaced {}

message PodReaped {}

message EndpointEvent {
    string endpoint_id = 1;
    optional string service_id = 2;
    optional string workload_id = 3;
    oneof event {
        EndpointActivated activated = 4;
        EndpointBackendReady backend_ready = 5;
        EndpointIdleTimerStarted idle_timer_started = 6;
        EndpointIdleTimerCancelled idle_timer_cancelled = 7;
        EndpointIdleTimeoutFired idle_timeout_fired = 8;
        EndpointDeactivated deactivated = 9;
    }
}

message EndpointActivated {
    EndpointActivationTrigger trigger = 1;
}

enum EndpointActivationTrigger {
    ENDPOINT_ACTIVATION_TRIGGER_UNSPECIFIED = 0;
    ENDPOINT_ACTIVATION_TRIGGER_TRAFFIC = 1;
}

message EndpointBackendReady {}

message EndpointIdleTimerStarted {
    uint64 timeout_ms = 1;
}

message EndpointIdleTimerCancelled {
    IdleTimerCancelReason reason = 1;
}

enum IdleTimerCancelReason {
    IDLE_TIMER_CANCEL_REASON_UNSPECIFIED = 0;
    IDLE_TIMER_CANCEL_REASON_NEW_TRAFFIC = 1;
}

message EndpointIdleTimeoutFired {}

message EndpointDeactivated {
    EndpointDeactivationReason reason = 1;
}

enum EndpointDeactivationReason {
    ENDPOINT_DEACTIVATION_REASON_UNSPECIFIED = 0;
    ENDPOINT_DEACTIVATION_REASON_IDLE_TIMEOUT = 1;
    ENDPOINT_DEACTIVATION_REASON_FORCE_DEACTIVATE = 2;
}

// --- Attach Workload ---

message AttachWorkloadInput {
    oneof input {
        AttachStart start = 1;
        AttachStdin stdin = 2;
        AttachResize resize = 3;
    }
}

message AttachStart {
    string namespace_id = 1;
    string workload_id = 2;
}

message AttachStdin {
    bytes data = 1;
}

message AttachResize {
    uint32 cols = 1;
    uint32 rows = 2;
}

message AttachWorkloadOutput {
    oneof output {
        AttachStarted started = 1;
        AttachStdout stdout = 2;
        AttachStderr stderr = 3;
        AttachExited exited = 4;
    }
}

message AttachStarted {
    bool tty = 1;              // whether the entrypoint is running with a PTY
}

message AttachStdout {
    bytes data = 1;
}

message AttachStderr {
    bytes data = 1;
}

message AttachExited {
    int32 exit_code = 1;
}

// --- Streaming (Logs, Status Watch) ---

message StreamLogsRequest {
    string namespace_id = 1;
    optional string workload_id = 2;
    repeated string container_ids = 3;
}

message WatchNamespaceStatusRequest {
    string namespace_id = 1;
}

message NamespaceStatusEvent {
    NamespaceStatusReport status = 1;
}

message LogChunk {
    string workload_id = 1;
    bytes data = 2;
    int64 timestamp_unix_ms = 3;
    string container_id = 4;
}
