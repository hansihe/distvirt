[package]
name = "distvirt-worker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "distvirt-worker"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
anyhow = "1"
base64 = "0.22"
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"
containerd-client = "0.8"
distvirt-common = { path = "../common" }
distvirt-guest-protocol = { path = "../guest-protocol" }
distvirt-activator = { path = "../activator" }
distvirt-worker-protocol = { path = "../worker-protocol" }
libc = "0.2"
log = "0.4"
oci-spec = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
smoltcp = { version = "0.12", default-features = false, features = ["medium-ip", "proto-ipv4", "socket-udp", "socket-tcp", "alloc", "log"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "process", "sync", "fs"] }
tonic = "0.12"
yamux = "0.13.9"
tokio-util = { version = "0.7.18", features = ["compat", "io-util"] }
futures-lite = "2.6.1"
boringtun = "0.7"
rand = "0.8"
sha2 = "0.10"
hickory-resolver = "0.25"
zerocopy = { version = "0.8", features = ["derive"] }
async-trait = "0.1"
snow = "0.10"
tar = "0.4"
uuid = { version = "1.22.0", features = ["v4"] }

[dev-dependencies]
env_logger = "0.11"
etherparse = "0.16"
futures-lite = "2.6.1"
tokio = { version = "1", features = ["signal"] }
