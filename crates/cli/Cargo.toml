[package]
name = "distvirt-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dv"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
distvirt-client-protocol = { path = "../client-protocol" }
distvirt-client = { path = "../client" }
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tonic.workspace = true
dirs.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "io-std", "signal", "net", "time"] }
tokio-stream.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
futures.workspace = true
base64.workspace = true
libc.workspace = true
rand.workspace = true
tempfile.workspace = true
tabled = "0.20.0"
