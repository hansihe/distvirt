apiVersion: v1
kind: Namespace

metadata:
  name: e2e-test

network:
  subnet: 172.16.0.0/24

workloads:
  echo:
    containers:
      - image: docker.io/library/alpine:latest
        args: ["/bin/sh", "-c", "while true; do printf 'HTTP/1.0 200 OK\\r\\nContent-Length: 3\\r\\n\\r\\nok\\n' | nc -l -p 8080; done"]
    services:
      echo:
        activation:
          activator:
            tcp: { ports: [8080] }
          idle_timeout: 5m
