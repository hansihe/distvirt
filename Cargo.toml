[workspace]
resolver = "3"
members = ["crates/common", "crates/worker", "crates/worker-protocol", "crates/guest-protocol", "crates/cli", "crates/activator", "crates/guest-init", "crates/orchestrator", "crates/client-protocol", "crates/tests", "crates/sm-router", "crates/sm-router-macros", "crates/untyped-vec", "crates/client"]
exclude = ["activators/test-echo", "activators/tcp", "activators/spin", "activators/http2", "activators/postgres", "activators/activator-types", "sdk/distvirt-sdk-core", "guest-image/test-containers"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
boringtun = "0.7"
clap = { version = "4", features = ["derive"] }
dirs = "6"
env_logger = "0.11"
etherparse = "0.19"
futures = "0.3"
futures-lite = "2.6.1"
libc = "0.2"
log = "0.4"
prost = "0.14"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smoltcp = { version = "0.13", default-features = false, features = [
    "medium-ip", "proto-ipv4", "socket-tcp", "socket-dns", "alloc", "log"
] }
tempfile = "3"
tokio = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7.18", features = ["compat"] }
toml = "1"
tonic = "0.14"
yamux = "0.13.10"

[profile.guest]
inherits = "release"
panic = "abort"
lto = true
strip = true
opt-level = "s"
