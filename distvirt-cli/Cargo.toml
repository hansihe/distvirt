[package]
name = "distvirt-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "distvirt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
distvirt = { path = "../distvirt" }
distvirt-compose = { path = "../distvirt-compose" }
distvirt-worker = { path = "../distvirt-worker" }
distvirt-worker-protocol = { path = "../distvirt-worker-protocol" }
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
