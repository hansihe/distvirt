[package]
name = "distvirt-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
distvirt-worker = { path = "../distvirt-worker" }
distvirt-worker-protocol = { path = "../distvirt-worker-protocol" }
distvirt-client-protocol = { path = "../distvirt-client-protocol" }
distvirt-client = { path = "../distvirt-client" }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.12"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "signal", "net", "time"] }
tokio-stream = "0.1"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
base64 = "0.22"
libc = "0.2"
tabled = "0.20.0"
