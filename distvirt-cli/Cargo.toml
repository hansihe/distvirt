[package]
name = "distvirt-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
distvirt-compose = { path = "../distvirt-compose" }
distvirt-worker = { path = "../distvirt-worker" }
distvirt-worker-protocol = { path = "../distvirt-worker-protocol" }
distvirt-client-protocol = { path = "../distvirt-client-protocol" }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tonic = "0.12"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "signal", "net", "time"] }
boringtun = "0.7"
base64 = "0.22"
libc = "0.2"
nix = { version = "0.29", features = ["ioctl"] }
rand = "0.8"
tabled = "0.20.0"
