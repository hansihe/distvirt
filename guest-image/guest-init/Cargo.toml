[package]
name = "guest-init"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "init"
path = "src/main.rs"

[dependencies]
anyhow = "1"
distvirt-guest-protocol = { path = "../../distvirt-guest-protocol" }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

