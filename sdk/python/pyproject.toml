[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "distvirt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.maturin]
manifest-path = "../distvirt-sdk-core/Cargo.toml"
python-source = "."
module-name = "distvirt._core"
